<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Point Cloud</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #111418; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  canvas:active { cursor: grabbing; }
  #status {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    font: 16px/1.4 system-ui, sans-serif; color: #c8ced6; text-align: center; padding: 24px;
    pointer-events: none;
  }
  #status[hidden] { display: none; }
</style>
</head>
<body>
<div id="status">Loading model…</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { PLYLoader } from 'three/addons/loaders/PLYLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- Settings (feel free to change) ----------
const FILE         = 'model.ply';  // name of the point cloud file
const BACKGROUND   = 0x111418;     // background color
const SPEED        = 1.5;          // auto-rotation speed (2 = one full turn in 30 seconds)
const RESUME_AFTER = 3000;         // milliseconds after the last touch before auto-rotation resumes (0 = never resume)
const USER_CONTROL = true;         // true = rotate and zoom with mouse/fingers, false = auto-rotation only
const ALLOW_ZOOM   = true;         // allow mouse-wheel zoom (inside Google Sites, set to false if it blocks page scrolling)
const POINT_SIZE   = 1;            // point size multiplier: larger = denser look, smaller = sparser
const Z_UP         = true;         // true if the scanned model lies on its side (typical for E57/LAS)
const TILT         = 0.25;         // initial camera tilt from above, in radians
const ZOOM         = 1.4;          // initial zoom: 1 = whole model with margin, 1.2 = 20% closer, 1.5 = 50% closer
const SHIFT_UP     = 0.1;         // move the model up in the frame, as a fraction of frame height (0.06 = 6%, 0 = centered)
// ----------------------------------------------------

const status = document.getElementById('status');

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(BACKGROUND);
document.body.appendChild(renderer.domElement);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 0.01, 10000);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;       // smooth inertia
controls.dampingFactor = 0.08;
controls.autoRotate = true;
controls.autoRotateSpeed = SPEED;
controls.enableRotate = USER_CONTROL;
controls.enablePan = USER_CONTROL;
controls.enableZoom = USER_CONTROL && ALLOW_ZOOM;

// auto-rotation pauses while the user holds the model and resumes after a pause
let resumeTimer = null;
controls.addEventListener('start', () => {
  controls.autoRotate = false;
  clearTimeout(resumeTimer);
});
controls.addEventListener('end', () => {
  if (RESUME_AFTER > 0) {
    resumeTimer = setTimeout(() => { controls.autoRotate = true; }, RESUME_AFTER);
  }
});

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.setViewOffset(w, h, 0, h * SHIFT_UP, w, h);   // shifts the picture up without changing scale
}
window.addEventListener('resize', resize);
resize();

new PLYLoader().load(
  FILE,
  (geometry) => {
    geometry.center();                      // move the cloud to the origin
    geometry.computeBoundingSphere();
    const radius = geometry.boundingSphere.radius;

    const hasColor = !!geometry.getAttribute('color');
    const material = new THREE.PointsMaterial({
      size: (radius / 450) * POINT_SIZE,    // point size adapts to the model scale
      sizeAttenuation: true,
      vertexColors: hasColor,
      color: hasColor ? 0xffffff : 0xdde3ea
    });

    const points = new THREE.Points(geometry, material);
    if (Z_UP) points.rotation.x = -Math.PI / 2;   // Z-up -> Y-up
    scene.add(points);

    // camera: look at the center so the whole model fits in the frame
    const fov = THREE.MathUtils.degToRad(camera.fov);
    const fitH = radius / Math.sin(fov / 2);
    const fitW = fitH / Math.min(1, camera.aspect);   // move further back on narrow screens
    const dist = (Math.max(fitH, fitW) * 1.05) / ZOOM;
    camera.position.set(0, Math.sin(TILT) * dist, Math.cos(TILT) * dist);
    camera.near = radius / 200;
    camera.far = radius * 40;
    camera.updateProjectionMatrix();

    controls.target.set(0, 0, 0);
    controls.minDistance = radius * 0.2;    // can't dive too deep into the cloud
    controls.maxDistance = dist * 2.5;      // or fly too far away
    controls.update();

    status.hidden = true;
    animate();
  },
  undefined,
  () => {
    status.textContent = 'Failed to load ' + FILE +
      '. Check that the file is in the same folder as index.html.';
  }
);

function animate() {
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
</script>
</body>
</html>
