<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Облако точек</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #111418; }
  canvas { display: block; width: 100%; height: 100%; pointer-events: none; }
  #status {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    font: 16px/1.4 system-ui, sans-serif; color: #c8ced6; text-align: center; padding: 24px;
  }
  #status[hidden] { display: none; }
</style>
</head>
<body>
<div id="status">Загрузка модели…</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { PLYLoader } from 'three/addons/loaders/PLYLoader.js';

// ---------- Настройки (можно менять) ----------
const FILE        = 'model.ply';   // имя файла с облаком точек
const BACKGROUND  = 0x111418;      // цвет фона
const SPEED       = 0.15;          // скорость вращения, радиан в секунду (0.15 ≈ один оборот за 42 секунды)
const POINT_SIZE  = 1;             // множитель размера точек: больше = плотнее, меньше = ажурнее
const Z_UP        = true;          // true, если модель из скана лежит «на боку» (обычно для E57/LAS)
const TILT        = 0.25;          // наклон камеры сверху, радианы
// -----------------------------------------------

const status = document.getElementById('status');

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(BACKGROUND);
document.body.appendChild(renderer.domElement);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 0.01, 10000);

// pivot вращается вокруг вертикальной оси экрана
const pivot = new THREE.Group();
scene.add(pivot);

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

new PLYLoader().load(
  FILE,
  (geometry) => {
    geometry.center();                      // ставим облако в начало координат
    geometry.computeBoundingSphere();
    const radius = geometry.boundingSphere.radius;

    const hasColor = !!geometry.getAttribute('color');
    const material = new THREE.PointsMaterial({
      size: (radius / 450) * POINT_SIZE,    // размер подстраивается под масштаб модели
      sizeAttenuation: true,
      vertexColors: hasColor,
      color: hasColor ? 0xffffff : 0xdde3ea
    });

    const points = new THREE.Points(geometry, material);
    if (Z_UP) points.rotation.x = -Math.PI / 2;   // Z вверх -> Y вверх
    pivot.add(points);

    // камера: смотрим на центр, чтобы модель целиком влезла в кадр
    const fov = THREE.MathUtils.degToRad(camera.fov);
    const fitH = radius / Math.sin(fov / 2);
    const fitW = fitH / Math.min(1, camera.aspect);   // для узких экранов отодвигаем дальше
    const dist = Math.max(fitH, fitW) * 1.05;
    camera.position.set(0, Math.sin(TILT) * dist, Math.cos(TILT) * dist);
    camera.lookAt(0, 0, 0);

    status.hidden = true;
    animate();
  },
  undefined,
  () => {
    status.textContent = 'Не удалось загрузить ' + FILE +
      '. Проверьте, что файл лежит рядом с index.html.';
  }
);

let last = performance.now();
function animate(now = performance.now()) {
  const dt = (now - last) / 1000;
  last = now;
  pivot.rotation.y += SPEED * dt;
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
</script>
</body>
</html>
