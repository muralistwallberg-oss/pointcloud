<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Point Cloud</title>

<!-- ============ SETTINGS: everything you may want to change is in this one block ============ -->
<script>
// ---------- Settings (feel free to change) ----------

// Page
const FILE               = 'model.ply';  // name of the point cloud file
const BACKGROUND         = 0xf9f3ee;     // background color (also used for the page behind the model)

// Rotation and controls
const SPEED              = 0.2;          // auto-rotation speed (2 = one full turn in 30 seconds)
const ROTATION_DIRECTION = 1;            // 1 or -1: flips the direction of rotation
const RESUME_AFTER       = 3000;         // milliseconds after the last touch before auto-rotation resumes (0 = never resume)
const USER_CONTROL       = true;         // true = rotate and zoom with mouse/fingers, false = auto-rotation only
const ALLOW_ZOOM         = true;         // allow mouse-wheel zoom (inside Google Sites, set to false if it blocks page scrolling)

// Camera
const Z_UP               = true;         // true if the scanned model lies on its side (typical for E57/LAS)
const START_ANGLE        = 230;            // where the camera starts around the model, in degrees: 0 = current view, 180 = opposite side, 90 and 270 = sides
const CAMERA_HEIGHT      = 0.3;          // camera height: 0 = bottom of the model, 0.5 = middle, 1 = top
const TARGET_HEIGHT      = 0.3;          // height of the point the camera looks at, same scale (equal to CAMERA_HEIGHT = level view)
const FOV                = 60;           // camera lens angle in degrees, the camera does not move: smaller = model appears larger (less in frame), larger = more fits in the frame (40 = default view)
const ZOOM               = 5.5;          // initial zoom: 1 = whole model with margin, 1.2 = 20% closer, 1.5 = 50% closer
const SHIFT_UP           = 0;            // move the model up in the frame, as a fraction of frame height (0.06 = 6%, 0 = centered)

// Points
const POINT_SIZE         = 1.0;            // point size multiplier: larger = denser look, smaller = sparser
const COLOR_MODE         = 'replace';    // 'original' = scan colors, 'tint' = scan colors mixed with POINT_COLOR, 'replace' = one color for all points
const POINT_COLOR        = 0x1b4557;     // color used by the 'tint' and 'replace' modes
const TINT_STRENGTH      = 0.5;          // 'tint' mode only: 0 = scan colors unchanged, 1 = fully POINT_COLOR
const POINT_OPACITY      = 1;            // 1 = solid, 0.6 = semi-transparent, lower = more airy
const ROUND_POINTS       = true;         // true = round points, false = square points

// Loading screen
const FADE_IN_TIME       = 1.3;          // seconds for the model to fade in after loading (0 = appear instantly)
const LOADING_TEXT       = 'Preparing magic…';   // text under the spinner
const ERROR_TEXT         = 'Failed to load the model.';
const SPINNER_COLOR      = '#c8d0da';    // color of the rotating arc

// ----------------------------------------------------

// page background is applied right away, before anything else loads
document.documentElement.style.background = '#' + BACKGROUND.toString(16).padStart(6, '0');
</script>

<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  canvas:active { cursor: grabbing; }
  #status {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 22px;
    font: 18px/1.4 system-ui, sans-serif; color: #c8ced6; text-align: center; padding: 24px;
    pointer-events: none; transition: opacity 0.4s ease;
  }
  #status[hidden] { display: none; }
  .spinner {
    width: 56px; height: 56px; border-radius: 50%;
    border: 6px solid rgba(255, 255, 255, 0.15); border-top-color: #c8d0da;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="status">
  <div class="spinner"></div>
  <div id="loading-text"></div>
</div>
<script>
  document.getElementById('loading-text').textContent = LOADING_TEXT;
  document.querySelector('.spinner').style.borderTopColor = SPINNER_COLOR;
</script>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { PLYLoader } from 'three/addons/loaders/PLYLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const status = document.getElementById('status');

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(BACKGROUND);
document.body.appendChild(renderer.domElement);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(FOV, 1, 0.01, 10000);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;       // smooth inertia
controls.dampingFactor = 0.08;
controls.autoRotate = true;
controls.autoRotateSpeed = SPEED * ROTATION_DIRECTION;
controls.enableRotate = USER_CONTROL;
controls.enablePan = USER_CONTROL;
controls.enableZoom = USER_CONTROL && ALLOW_ZOOM;

// auto-rotation pauses while the user holds the model and resumes after a pause
let resumeTimer = null;
controls.addEventListener('start', () => {
  controls.autoRotate = false;
  clearTimeout(resumeTimer);
});
controls.addEventListener('end', () => {
  if (RESUME_AFTER > 0) {
    resumeTimer = setTimeout(() => { controls.autoRotate = true; }, RESUME_AFTER);
  }
});

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.setViewOffset(w, h, 0, h * SHIFT_UP, w, h);   // shifts the picture up without changing scale
}
window.addEventListener('resize', resize);
resize();

// soft round sprite used when ROUND_POINTS is true
function makeCircleTexture() {
  const size = 64;
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const g = canvas.getContext('2d');
  g.beginPath();
  g.arc(size / 2, size / 2, size / 2 - 1, 0, Math.PI * 2);
  g.fillStyle = '#ffffff';
  g.fill();
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

let material = null;
let fadeStart = null;

new PLYLoader().load(
  FILE,
  (geometry) => {
    geometry.center();                      // move the cloud to the origin
    geometry.computeBoundingBox();
    geometry.computeBoundingSphere();
    const radius = geometry.boundingSphere.radius;

    // model height (Z in the scan file if Z_UP, otherwise Y); used for CAMERA_HEIGHT and TARGET_HEIGHT
    const bb = geometry.boundingBox;
    const lo = Z_UP ? bb.min.z : bb.min.y;
    const hi = Z_UP ? bb.max.z : bb.max.y;
    const modelHeight = hi - lo;

    // ----- point colors -----
    const hasColor = !!geometry.getAttribute('color');
    const base = new THREE.Color(POINT_COLOR);
    let vertexColors = false;
    let color = new THREE.Color(0xdde3ea);              // fallback when the scan has no colors

    if (COLOR_MODE === 'original') {
      if (hasColor) { vertexColors = true; color = new THREE.Color(0xffffff); }
    } else if (COLOR_MODE === 'tint') {
      if (hasColor) {
        vertexColors = true;
        color = new THREE.Color(0xffffff).lerp(base, TINT_STRENGTH);
      } else {
        color = base.clone();                           // no scan colors: same as 'replace'
      }
    } else {                                            // 'replace'
      color = base.clone();
    }

    const fading = FADE_IN_TIME > 0;
    material = new THREE.PointsMaterial({
      size: (radius / 450) * POINT_SIZE,    // point size adapts to the model scale
      sizeAttenuation: true,
      vertexColors,
      color,
      map: ROUND_POINTS ? makeCircleTexture() : null,
      alphaTest: ROUND_POINTS ? 0.5 : 0,
      transparent: true,
      opacity: fading ? 0 : POINT_OPACITY,
      depthWrite: !fading && POINT_OPACITY >= 1
    });

    const points = new THREE.Points(geometry, material);
    if (Z_UP) points.rotation.x = -Math.PI / 2;   // Z-up -> Y-up
    scene.add(points);

    // ----- camera -----
    const fov = THREE.MathUtils.degToRad(40);   // fixed reference lens: camera distance does not depend on FOV
    const fitH = radius / Math.sin(fov / 2);
    const fitW = fitH / Math.min(1, camera.aspect);   // move further back on narrow screens
    const dist = (Math.max(fitH, fitW) * 1.05) / ZOOM;

    // heights: 0 = bottom of the model, 0.5 = middle, 1 = top (the cloud is centered at 0)
    const targetY = (TARGET_HEIGHT - 0.5) * modelHeight;
    const camY    = (CAMERA_HEIGHT - 0.5) * modelHeight;
    const dy      = THREE.MathUtils.clamp(camY - targetY, -dist * 0.98, dist * 0.98);
    const horiz = Math.sqrt(dist * dist - dy * dy);
    const a = THREE.MathUtils.degToRad(START_ANGLE);        // start position around the model
    camera.position.set(Math.sin(a) * horiz, targetY + dy, Math.cos(a) * horiz);

    camera.near = radius / 200;
    camera.far = radius * 40;
    camera.updateProjectionMatrix();

    controls.target.set(0, targetY, 0);
    controls.minDistance = radius * 0.2;    // can't dive too deep into the cloud
    controls.maxDistance = dist * 2.5;      // or fly too far away
    controls.update();

    // ----- reveal -----
    if (fading) {
      status.style.opacity = '0';
      setTimeout(() => { status.hidden = true; }, 450);
      fadeStart = performance.now();
    } else {
      status.hidden = true;
    }
    animate();
  },
  undefined,
  () => {
    status.textContent = ERROR_TEXT;
  }
);

function animate(now = performance.now()) {
  if (fadeStart !== null) {
    const k = Math.min(Math.max((now - fadeStart) / (FADE_IN_TIME * 1000), 0), 1);
    material.opacity = POINT_OPACITY * (1 - Math.pow(1 - k, 3));   // ease-out
    if (k >= 1) {
      material.depthWrite = POINT_OPACITY >= 1;
      fadeStart = null;
    }
  }
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
</script>
</body>
</html>
